// The standalone coordinator control plane, in one module. It carries:
//   * the CoordinatorStore contract, domain records, epoch codec and in-memory reference store
//     (formerly :coordinator:spi),
//   * the self-hosted CoordinatorServer, the gRPC CellCoordinator service, the reconcile/retire loop,
//     the live census and namespace provisioning (formerly :coordinator:runtime),
//
// It talks to cells only over gRPC (:proto) and NEVER depends on :server or any storage module -- the
// cell engine and the coordinator are fully decoupled in source. Nothing outside this module implements
// its contract, so it is genuinely standalone.
dependencies {
    api(project(":core"))
    // The shared leader election -- the same one :server runs. Depends on neither side.
    api(project(":election"))
    // The placement rules (ring model, mint/resolve decisions) -- pure, shared with :server,
    // depending on neither side.
    api(project(":placement"))
    api(project(":proto"))

    // The JDBC coordinator-store backend: connection pooling only. The JDBC driver is supplied at
    // runtime by the distribution; talking to the database directly keeps this module free of the
    // engine's :jdbc storage module (which would pull in :server and break the decoupling).
    implementation("com.zaxxer:HikariCP:${property("hikariVersion")}")

    testImplementation(platform("org.junit:junit-bom:${property("junitVersion")}"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    testImplementation("com.h2database:h2:${property("h2Version")}")
    testRuntimeOnly("org.postgresql:postgresql:${property("postgresVersion")}")  // opt-in live-PG run
}
