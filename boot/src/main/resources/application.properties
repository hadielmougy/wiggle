spring.application.name=wiggle
spring.main.banner-mode=off
spring.threads.virtual.enabled=true
# Long polls hold requests for up to WIGGLE_LONGPOLL_MAX_MILLIS; a stopping node drops them, and workers poll again.
server.shutdown=immediate
# Actuator's health on the probe port (WIGGLE_DASHBOARD_PORT) at /healthz, with /healthz/liveness and /healthz/readiness.
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.health=healthz
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
# The API and the portal answer their own errors; Boot's /error page would be served by the portal's /* servlet.
spring.autoconfigure.exclude=org.springframework.boot.webmvc.autoconfigure.error.ErrorMvcAutoConfiguration
