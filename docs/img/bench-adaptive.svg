<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Wiggle adaptive polling — measured before/after for timer promotion and cross-node dispatch latency</title>
  <desc id="d">Left: draining 2,000 due timers takes 19.9 seconds with the fixed housekeeping sweep (100 per second, the batch-per-tick floor) and 1.18 seconds with the adaptive sweep (about 1,700 per second). Right: cross-node dispatch latency on a two-node cluster falls from a p50 of 105 milliseconds with the fixed fallback interval to 28 milliseconds with the adaptive ramp; p99 falls from 117 to 39 milliseconds.</desc>

  <text x="60" y="30" font-size="15" font-weight="700" fill="#1e2233">Adaptive polling — react to the last poll, never to queue depth</text>
  <text x="60" y="50" font-size="11.5" fill="#7c8296">opt-in flags, measured · an idle system pays nothing extra · throughput-neutral (300/s cluster ceiling re-validated with both flags on)</text>

  <!-- ================= LEFT PANEL: timer promotion ================= -->
  <rect x="60" y="72" width="410" height="330" rx="10" fill="#f6f8fc"/>
  <text x="80" y="100" font-size="12.5" font-weight="700" fill="#1e2233">Timer promotion under backlog</text>
  <text x="80" y="117" font-size="10.5" fill="#7c8296">2,000 due timers · default cadence (1s tick × batch 100) · in-memory</text>

  <!-- fixed sweep bar -->
  <text x="80" y="162" font-size="11" fill="#1e2233">fixed sweep</text>
  <rect x="80" y="170" width="330" height="34" rx="5" fill="#d64545" opacity="0.85"/>
  <text x="404" y="192" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="end">19.9s</text>
  <text x="80" y="222" font-size="10.5" fill="#7c8296">100 timers/sec — pinned to the batch÷tick floor</text>

  <!-- adaptive sweep bar -->
  <text x="80" y="262" font-size="11" fill="#1e2233">adaptive sweep</text>
  <rect x="80" y="270" width="20" height="34" rx="5" fill="#2f9e63"/>
  <text x="108" y="292" font-size="11.5" font-weight="700" fill="#2f9e63">1.18s</text>
  <text x="80" y="322" font-size="10.5" fill="#7c8296">~1,700 timers/sec — drains until a partial batch</text>

  <text x="80" y="356" font-size="12" font-weight="700" fill="#2f9e63">~17× faster</text>
  <text x="80" y="374" font-size="10.5" fill="#7c8296">10,000 due timers drain in 1.61s (≈6,200/sec)</text>
  <text x="80" y="392" font-size="10" fill="#7c8296" font-family="ui-monospace, Menlo, monospace">WIGGLE_ADAPTIVE_HOUSEKEEPING=true</text>

  <!-- ================= RIGHT PANEL: cross-node dispatch latency ================= -->
  <rect x="500" y="72" width="420" height="330" rx="10" fill="#f6f8fc"/>
  <text x="520" y="100" font-size="12.5" font-weight="700" fill="#1e2233">Cross-node dispatch latency</text>
  <text x="520" y="117" font-size="10.5" fill="#7c8296">2-node cluster, one Postgres · submitter and parked worker on different nodes</text>

  <!-- axis: 0..120ms mapped to y 330..150 (1.5 px/ms) -->
  <g stroke="#e3e6ee" stroke-width="1">
    <line x1="540" y1="180" x2="900" y2="180"/>
    <line x1="540" y1="255" x2="900" y2="255"/>
  </g>
  <line x1="540" y1="330" x2="900" y2="330" stroke="#8a90a2" stroke-width="1.5"/>
  <g font-size="10" fill="#7c8296" text-anchor="end">
    <text x="533" y="334">0</text>
    <text x="533" y="259">50ms</text>
    <text x="533" y="184">100ms</text>
  </g>

  <!-- p50 group -->
  <rect x="560" y="172.5" width="40" height="157.5" rx="4" fill="#d64545" opacity="0.85"/>
  <text x="580" y="166" font-size="10.5" font-weight="700" fill="#d64545" text-anchor="middle">105</text>
  <rect x="606" y="288" width="40" height="42" rx="4" fill="#2f9e63"/>
  <text x="626" y="282" font-size="10.5" font-weight="700" fill="#2f9e63" text-anchor="middle">28</text>
  <text x="603" y="348" font-size="11" fill="#1e2233" text-anchor="middle">p50</text>

  <!-- p90 group -->
  <rect x="680" y="166.5" width="40" height="163.5" rx="4" fill="#d64545" opacity="0.85"/>
  <text x="700" y="160" font-size="10.5" font-weight="700" fill="#d64545" text-anchor="middle">109</text>
  <rect x="726" y="282" width="40" height="48" rx="4" fill="#2f9e63"/>
  <text x="746" y="276" font-size="10.5" font-weight="700" fill="#2f9e63" text-anchor="middle">32</text>
  <text x="723" y="348" font-size="11" fill="#1e2233" text-anchor="middle">p90</text>

  <!-- p99 group -->
  <rect x="800" y="154.5" width="40" height="175.5" rx="4" fill="#d64545" opacity="0.85"/>
  <text x="820" y="148" font-size="10.5" font-weight="700" fill="#d64545" text-anchor="middle">117</text>
  <rect x="846" y="271.5" width="40" height="58.5" rx="4" fill="#2f9e63"/>
  <text x="866" y="265.5" font-size="10.5" font-weight="700" fill="#2f9e63" text-anchor="middle">39</text>
  <text x="843" y="348" font-size="11" fill="#1e2233" text-anchor="middle">p99</text>

  <text x="520" y="374" font-size="12" font-weight="700" fill="#2f9e63">~3.5× lower latency</text>
  <text x="520" y="392" font-size="10" fill="#7c8296" font-family="ui-monospace, Menlo, monospace">WIGGLE_ADAPTIVE_FALLBACK_POLL=true</text>

  <!-- legend -->
  <g font-size="10.5" fill="#7c8296">
    <rect x="700" y="86" width="11" height="11" rx="2" fill="#d64545" opacity="0.85"/>
    <text x="716" y="95.5">fixed interval</text>
    <rect x="800" y="86" width="11" height="11" rx="2" fill="#2f9e63"/>
    <text x="816" y="95.5">adaptive</text>
  </g>

  <text x="60" y="440" font-size="10.5" fill="#7c8296">MacBook Pro M2 Pro (10 cores) · left: embedded engine, :example:timerBench · right: kind cluster with PostgreSQL cells, :example:fallbackProbe (200 sequential probes × 2 runs) · both harnesses ship in the repo</text>
</svg>
