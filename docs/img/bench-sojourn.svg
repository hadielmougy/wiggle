<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Wiggle rate-ceiling benchmark — end-to-end completion latency over time at two offered rates</title>
  <desc id="d">Probe sojourn (submit to COMPLETED) over a sustained-load stage against a kind cluster with fresh databases. At 300 starts/sec latency settles to sub-second. At 340 the queue grows steadily: latency climbs to about 24 seconds over 90 seconds. Measured on one laptop.</desc>

  <text x="80" y="30" font-size="15" font-weight="700" fill="#1e2233">Where the queue starts to pile up — a kind cluster on one laptop</text>
  <text x="80" y="50" font-size="11.5" fill="#7c8296">probe sojourn (start → COMPLETED) during a sustained-load stage · order-fulfilment fork/join workflow · fresh databases</text>

  <!-- grid + axes -->
  <g stroke="#e3e6ee" stroke-width="1">
    <line x1="80" y1="52"  x2="900" y2="52"/>
    <line x1="80" y1="110" x2="900" y2="110"/>
    <line x1="80" y1="167" x2="900" y2="167"/>
    <line x1="80" y1="225" x2="900" y2="225"/>
    <line x1="80" y1="282" x2="900" y2="282"/>
  </g>
  <line x1="80" y1="340" x2="900" y2="340" stroke="#8a90a2" stroke-width="1.5"/>
  <line x1="80" y1="46"  x2="80"  y2="340" stroke="#8a90a2" stroke-width="1.5"/>
  <g font-size="10.5" fill="#7c8296" text-anchor="end">
    <text x="72" y="344">0s</text>
    <text x="72" y="286">5s</text>
    <text x="72" y="229">10s</text>
    <text x="72" y="171">15s</text>
    <text x="72" y="114">20s</text>
    <text x="72" y="56">25s</text>
  </g>
  <g font-size="10.5" fill="#7c8296" text-anchor="middle">
    <text x="80"  y="358">0</text>
    <text x="353" y="358">30s</text>
    <text x="627" y="358">60s</text>
    <text x="900" y="358">90s</text>
  </g>
  <text x="490" y="378" font-size="11" fill="#7c8296" text-anchor="middle">time into the stage</text>

  <!-- 300/s: sustained, settling to sub-second -->
  <polyline fill="none" stroke="#2f9e63" stroke-width="2.5" stroke-linejoin="round"
    points="80,332 98,323 116,328 135,330 153,315 171,298 189,294 208,304 226,313 244,309 262,291 280,309 299,315 317,292 335,297 353,307 372,313 390,336 408,318 426,326 444,337 463,337 481,337 499,337 517,336 536,333 554,336 572,337 590,337 608,332"/>

  <!-- 340/s over 90s: over the ceiling -->
  <polyline fill="none" stroke="#d64545" stroke-width="2.5" stroke-linejoin="round"
    points="80,336 116,313 153,307 189,258 226,281 262,268 299,261 335,245 372,228 408,195 444,195 481,181 517,173 554,141 590,119 627,97 663,64 700,63 736,62 772,61 809,64 845,81 882,101"/>

  <!-- series labels -->
  <text x="470" y="325" font-size="12" font-weight="600" fill="#2f9e63">300/s — sustained (settles below 1s)</text>
  <text x="380" y="165" font-size="12" font-weight="600" fill="#d64545">340/s — over the ceiling: holds 60s, then the backlog compounds</text>

  <!-- verdict box -->
  <rect x="80" y="398" width="820" height="52" rx="9" fill="#f6f8fc" stroke="#aab0c0" stroke-width="1.2"/>
  <text x="98" y="420" font-size="12.5" fill="#1e2233"><tspan font-weight="700">Ceiling ≈ 300–340 starts/sec sustained</tspan> — ≈2,400+ durable step executions/sec through the cluster, with sub-second completion latency at 300/s.</text>
  <text x="98" y="438" font-size="11" fill="#7c8296">340/s survives a 60s burst but drifts over 90s. Every component shares the laptop's 10 cores — a floor, not a ceiling. Scale past it by adding cells on real hardware.</text>
</svg>
