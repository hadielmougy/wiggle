<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" role="img" aria-label="Wiggle architecture: clients and pull-based workers talk gRPC to a wiggle server cluster over one database; a standalone ops console is another gRPC client.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a90a2"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6cff"/>
    </marker>
    <style>
      .t  { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .m  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .h  { font-size: 15px; font-weight: 600; fill: #1e2233; }
      .s  { font-size: 11.5px; fill: #7c8296; }
      .s2 { font-size: 11.5px; fill: #3c4257; }
      .lbl{ font-size: 11px; fill: #7c8296; }
    </style>
  </defs>

  <rect width="980" height="560" fill="#fbfcff"/>

  <!-- ── top row: the three kinds of gRPC client ────────────────────────────── -->
  <rect x="40" y="36" width="270" height="104" rx="10" fill="#ffffff" stroke="#c3c8d4"/>
  <text class="t h" x="60" y="66">Clients</text>
  <text class="t s" x="60" y="87">Java · Go · Python</text>
  <text class="m s2" x="60" y="110">start · signal · query · cancel</text>
  <text class="t s" x="60" y="128">your services</text>

  <rect x="355" y="36" width="270" height="104" rx="10" fill="#ffffff" stroke="#c3c8d4"/>
  <text class="t h" x="375" y="66">Workers</text>
  <text class="t s" x="375" y="87">@Handlers · pull-based</text>
  <text class="m s2" x="375" y="110">poll · settle</text>
  <text class="t s" x="375" y="128">gRPC long-poll, no inbound ports</text>

  <rect x="670" y="36" width="270" height="104" rx="10" fill="#f6f8fc" stroke="#c3c8d4"/>
  <text class="t h" x="690" y="66">Ops console</text>
  <text class="t s" x="690" y="87">standalone web UI :8090</text>
  <text class="t s" x="690" y="110">trace · cancel · signal · schedules</text>
  <text class="t s" x="690" y="128">a pure gRPC client, like any other</text>

  <!-- ── arrows down into the cluster ───────────────────────────────────────── -->
  <line x1="175" y1="140" x2="175" y2="214" stroke="#5b6cff" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
  <line x1="490" y1="140" x2="490" y2="214" stroke="#5b6cff" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
  <line x1="805" y1="140" x2="805" y2="214" stroke="#8a90a2" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text class="m lbl" x="500" y="185">gRPC :8080</text>

  <!-- ── the server cluster ─────────────────────────────────────────────────── -->
  <rect x="40" y="218" width="900" height="182" rx="12" fill="#eef1f6" stroke="#aab0c0"/>
  <text class="t h" x="64" y="248">wiggle server — one cluster, one database</text>
  <text class="t s" x="64" y="268">add nodes for capacity and availability; any node can drive any instance</text>

  <rect x="64" y="284" width="270" height="96" rx="9" fill="#ffffff" stroke="#8a90a2"/>
  <text class="t h" x="84" y="311" font-size="13.5">wiggle node</text>
  <text class="m s2" x="84" y="333">engine · gRPC :8080</text>
  <text class="t s" x="84" y="353">leader: timers · recovery</text>
  <text class="t s" x="84" y="370">/healthz</text>

  <rect x="355" y="284" width="270" height="96" rx="9" fill="#ffffff" stroke="#8a90a2"/>
  <text class="t h" x="375" y="311" font-size="13.5">wiggle node</text>
  <text class="m s2" x="375" y="333">engine · gRPC :8080</text>
  <text class="t s" x="375" y="353">leases · shared queue</text>
  <text class="t s" x="375" y="370">/healthz</text>

  <rect x="646" y="284" width="270" height="96" rx="9" fill="#ffffff" stroke="#c3c8d4" stroke-dasharray="5 4"/>
  <text class="t h" x="666" y="311" font-size="13.5" fill="#7c8296">more nodes…</text>
  <text class="t s" x="666" y="333">or embed the server in your JVM</text>
  <text class="m s2" x="666" y="355">new WiggleServer(config)</text>

  <!-- ── the database ───────────────────────────────────────────────────────── -->
  <line x1="490" y1="400" x2="490" y2="442" stroke="#8a90a2" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="m lbl" x="500" y="426">JDBC</text>

  <rect x="250" y="446" width="480" height="80" rx="10" fill="#e3f6ea" stroke="#2f9e63"/>
  <text class="t h" x="274" y="476">PostgreSQL — the durable state</text>
  <text class="t s" x="274" y="497">instances · tokens · timers · schedules · definitions</text>
  <text class="t s" x="274" y="515">also MySQL · Oracle · SQL Server · H2 and in-memory for dev</text>
</svg>
