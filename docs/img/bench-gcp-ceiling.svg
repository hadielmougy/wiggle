<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t2 d2">
  <rect width="980" height="330" fill="#ffffff"/>
  <title id="t2">Wiggle ceiling by Cloud SQL size — durable step executions per second for one server node</title>
  <desc id="d2">On an 8 vCPU Cloud SQL the ceiling is 4,800 durable step executions per second (600 instances per second), with flat 260 millisecond latency up to 4,000 steps per second. On a 16 vCPU Cloud SQL the ceiling is 7,200 steps per second (900 instances per second), flat up to 5,600 steps per second.</desc>
  <text x="80" y="30" font-size="15" font-weight="700" fill="#1e2233">The ceiling follows the database — one server node, two Cloud SQL sizes</text>
  <text x="80" y="50" font-size="11.5" fill="#7c8296">durable step executions/sec (instances/sec) · light: flat ≈260ms end to end · dark: sustained ceiling</text>
  <g stroke="#e3e6ee" stroke-width="1">
    <line x1="250" y1="72" x2="250" y2="232"/>
    <line x1="402" y1="72" x2="402" y2="232"/>
    <line x1="555" y1="72" x2="555" y2="232"/>
    <line x1="708" y1="72" x2="708" y2="232"/>
    <line x1="860" y1="72" x2="860" y2="232"/>
  </g>
  <g font-size="10.5" fill="#7c8296" text-anchor="middle">
    <text x="250" y="250">0</text>
    <text x="402" y="250">2,000</text>
    <text x="555" y="250">4,000</text>
    <text x="708" y="250">6,000</text>
    <text x="860" y="250">8,000</text>
  </g>
  <text x="555" y="270" font-size="11" fill="#7c8296" text-anchor="middle">durable step executions/sec</text>
  <text x="236" y="108" font-size="13" font-weight="700" fill="#1e2233" text-anchor="end">8 vCPU</text>
  <text x="236" y="124" font-size="10.5" fill="#7c8296" text-anchor="end">db-custom-8-32768</text>
  <rect x="250" y="88" width="366" height="44" rx="5" fill="#2f6fd6"/>
  <rect x="250" y="88" width="305" height="44" rx="5" fill="#9fc0f2"/>
  <text x="545" y="115" font-size="11" fill="#1e2233" text-anchor="end">4,000 (500/s)</text>
  <text x="626" y="108" font-size="13" font-weight="700" fill="#1e2233">4,800 steps/s</text>
  <text x="626" y="124" font-size="11" fill="#7c8296">600 instances/sec</text>
  <text x="236" y="184" font-size="13" font-weight="700" fill="#1e2233" text-anchor="end">16 vCPU</text>
  <text x="236" y="200" font-size="10.5" fill="#7c8296" text-anchor="end">db-custom-16-65536</text>
  <rect x="250" y="164" width="549" height="44" rx="5" fill="#2f6fd6"/>
  <rect x="250" y="164" width="427" height="44" rx="5" fill="#9fc0f2"/>
  <text x="667" y="191" font-size="11" fill="#1e2233" text-anchor="end">5,600 (700/s)</text>
  <text x="809" y="184" font-size="13" font-weight="700" fill="#1e2233">7,200 steps/s</text>
  <text x="809" y="200" font-size="11" fill="#7c8296">900 instances/sec</text>
  <rect x="80" y="286" width="820" height="32" rx="9" fill="#f6f8fc" stroke="#aab0c0" stroke-width="1.2"/>
  <text x="98" y="307" font-size="11.5" fill="#1e2233">Doubling the database's vCPUs raised the ceiling 1.5×. The same server node (c3-standard-8) served both, at 25–40% CPU.</text>
</svg>
