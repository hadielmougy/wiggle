# --- Maven Central publishing -------------------------------------------------
# Do NOT put real secrets here. Supply them at release time via ~/.gradle/gradle.properties
# or environment variables (ORG_GRADLE_PROJECT_<name>). See RELEASING.md.
#
# Central Portal token (from https://central.sonatype.com -> Account -> Generate token):
#   mavenCentralUsername=<token-username>
#   mavenCentralPassword=<token-password>
#
# GPG signing key, exported in-memory (ASCII-armored private key):
#   signingInMemoryKey=<armored-secret-key>
#   signingInMemoryKeyPassword=<key-passphrase>
