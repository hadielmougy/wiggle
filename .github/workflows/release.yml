name: Release

# Cutting a release is a tag push: `git tag v0.0.1 && git push origin v0.0.1`. The tag's version
# (minus the leading `v`) must match `version` in build.gradle.kts. This workflow builds the
# runnable server distribution, checksums and signs it, and attaches everything to the GitHub
# Release — so anyone can download one file and run it, no build, no Maven, no container registry.
#
# `workflow_dispatch` runs the same build on demand and uploads the archives as a run artifact (no
# Release is created), so the pipeline can be exercised without cutting a tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create the Release and upload assets
  id-token: write   # keyless (Sigstore) signing of the checksums, no stored key

jobs:
  tarball:
    name: Runnable distribution (tar + zip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The distribution bundles the ops console, whose UI is a ClojureScript (shadow-cljs) app —
      # Node builds it. Without Node the build still succeeds but ships no dashboard.
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the distribution
        run: ./gradlew --no-daemon :dist:distTar :dist:distZip

      # In a fresh checkout only the current version's archives exist, so the globs are unambiguous.
      - name: Checksums
        working-directory: dist/build/distributions
        run: sha256sum wiggle-server-*.tar wiggle-server-*.zip > SHA-256SUMS

      # Catch the classic mistake: tag bumped but build.gradle.kts version not (or vice versa). The
      # archive is named from the Gradle project version, so a matching file must exist for the tag.
      - name: Verify the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [ ! -f "dist/build/distributions/wiggle-server-${VER}.tar" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the Gradle project version " \
                 "(no wiggle-server-${VER}.tar was built). Set 'version' in build.gradle.kts to ${VER}."
            exit 1
          fi

      - name: Install Cosign
        if: startsWith(github.ref, 'refs/tags/')
        uses: sigstore/cosign-installer@v3

      # One keyless signature over the checksums manifest covers every asset (verify a download by
      # checking it against SHA-256SUMS, then verifying SHA-256SUMS itself against the signature).
      - name: Sign the checksums (keyless)
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: dist/build/distributions
        run: |
          cosign sign-blob --yes SHA-256SUMS \
            --output-signature SHA-256SUMS.sig \
            --output-certificate SHA-256SUMS.pem

      # Always available (incl. workflow_dispatch): download the build from the Actions run to test.
      - name: Upload run artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiggle-distribution
          path: |
            dist/build/distributions/wiggle-server-*.tar
            dist/build/distributions/wiggle-server-*.zip
            dist/build/distributions/SHA-256SUMS*

      - name: Create the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=(
            dist/build/distributions/wiggle-server-*.tar
            dist/build/distributions/wiggle-server-*.zip
            dist/build/distributions/SHA-256SUMS
            dist/build/distributions/SHA-256SUMS.sig
            dist/build/distributions/SHA-256SUMS.pem
          )
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${ASSETS[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${ASSETS[@]}" \
              --title "Wiggle ${GITHUB_REF_NAME}" --generate-notes
          fi
