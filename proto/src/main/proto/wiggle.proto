syntax = "proto3";

package com.wiggle.proto;

option java_package = "com.wiggle.proto";
option java_multiple_files = true;

import "google/protobuf/struct.proto";

// The control-plane API. Workers pull work from here; nothing is ever pushed to them,
// so workers need no inbound connectivity and can scale independently of the servers.
service WiggleControlPlane {
    rpc HealthCheck(Empty) returns (HealthStatus);
    rpc GetCluster(Empty) returns (ClusterView);

    rpc ListWorkflows(Empty) returns (WorkflowNames);
    // Dispatchable work split by (workflow, version, queue), each flagged with whether any worker
    // polling this node would claim it. An uncovered slice is work nothing can pick up.
    rpc GetBacklogCoverage(BacklogCoverageRequest) returns (BacklogCoverage);
    rpc RegisterWorkflow(WorkflowDefinition) returns (RegisterWorkflowResult);
    rpc GetWorkflow(GetWorkflowRequest) returns (WorkflowDefinition);

    rpc StartInstance(StartInstanceRequest) returns (StartInstanceResult);
    rpc ListInstances(ListInstancesRequest) returns (InstanceList);
    rpc GetInstance(InstanceIdRequest) returns (InstanceDetail);
    rpc CancelInstance(CancelInstanceRequest) returns (CancelInstanceResult);
    // Delivers a named signal to a running instance; the payload merges into its context.
    rpc SignalInstance(SignalRequest) returns (Ack);

    rpc CreateSchedule(CreateScheduleRequest) returns (ScheduleView);
    rpc ListSchedules(Empty) returns (ScheduleList);
    rpc DeleteSchedule(ScheduleIdRequest) returns (Ack);

    rpc PollTasks(PollRequest) returns (TaskList);
    // The one way a worker reports finished work: one run of steps, or several independent runs
    // applied in a single commit. The server resolves each workflow's execution mode and decides
    // from it whether the continuation is leased back to this worker or released -- the client
    // never chooses that, so it cannot choose wrong. Answers are per run, keyed by task id.
    rpc ReportSteps(ReportStepsRequest) returns (ReportStepsResult);
    rpc FailTask(TaskFailureRequest) returns (Ack);
    rpc HeartbeatTask(HeartbeatRequest) returns (HeartbeatResult);

    // The event feed: pull-and-ack over the durable event log. A consumer is a named cursor;
    // PollEvents long-polls like PollTasks and merges every shard's log, AckEvents advances the
    // cursor to the one an entry carries.
    rpc PollEvents(PollEventsRequest) returns (EventList);
    rpc AckEvents(AckEventsRequest) returns (Ack);

    // Per-node duration statistics over recently settled steps of one workflow version.
    rpc GetStepStats(StepStatsRequest) returns (StepStats);

    // Full-text search over instances, across every search shard; FAILED_PRECONDITION when search is
    // not enabled. Hits are limited to the workflows the caller may read.
    rpc SearchInstances(SearchRequest) returns (SearchResult);
}

message SearchRequest {
    // Every word must occur in the instance's correlation id, context, termination reason or error;
    // empty matches every instance the filters allow.
    string text = 1;
    optional string workflow = 2;
    optional string status = 3;
    // Bounds on when the instance last changed (epoch millis); 0 = open.
    int64 updated_from = 4;
    int64 updated_to = 5;
    int32 limit = 6;
    // Answer from the search shards that respond when one does not, and say so in `partial`.
    bool partial_ok = 7;
    // Rank by closeness in meaning (vector search) instead of by the words; needs an embedder and a
    // complete vector index, else FAILED_PRECONDITION.
    bool semantic = 8;
}

message SearchHit {
    string instance_id = 1;
    string workflow = 2;
    int32 version = 3;
    string status = 4;
    string correlation_id = 5;
    int64 created_at = 6;
    int64 updated_at = 7;
    double score = 8;
    // The instance itself has been purged; its document outlives it until its own retention.
    bool purged = 9;
}

message SearchResult {
    repeated SearchHit hits = 1;
    bool partial = 2;
    // The embedding model a semantic search used; empty for a text search.
    string model = 3;
}

message Empty {}

message Ack { bool ok = 1; }

message HealthStatus {
    string status = 1;
    string node = 2;
    bool leader = 3;
}

message ClusterMember {
    string id = 1;
    string name = 2;
    int64 first_heartbeat = 3;
    int64 last_heartbeat = 4;
    int32 workers = 5;
    bool leader = 6;
    bool alive = 7;
}

message ClusterView {
    string self = 1;
    bool leader = 2;
    repeated ClusterMember members = 3;
}

// A workflow definition's shape (nodes as a sorted array, sparse per-kind fields) is
// already JSON-native (see core.WorkflowDefinition/Node#toJson); rather than re-modeling
// it in proto, the whole definition travels as one opaque Struct, exactly as its JSON
// body does over HTTP today, converted at the edges via
// ProtoJson + WorkflowDefinition.toJson()/fromJson().

message WorkflowDefinition {
    google.protobuf.Struct definition = 1;
    // RegisterWorkflow only: replace an already-registered (name, version) whose graph differs,
    // instead of failing. The server refuses unless it is configured to allow it.
    bool force = 2;
}

message WorkflowNames {
    repeated string workflows = 1;
}

message RegisterWorkflowResult {
    string name = 1;
    string version = 2;
    int64 nodes = 3;
}

message GetWorkflowRequest {
    string name = 1;
    // Absent = the latest registered version. A worker that binds handlers for one specific version
    // asks for that version, so its signatures are checked against the graph it will actually serve.
    optional int32 version = 2;
}

// One (workflow, version) a worker serves. Used to scope claims: a worker that registers handlers
// for a specific version must not claim another version's tasks, or it would run the wrong code
// under a name that matches.
message WorkflowVersion {
    string workflow = 1;
    int32 version = 2;
}

message BacklogCoverageRequest {
    int32 max = 1;   // 0 = a server default
}

message BacklogSlice {
    string workflow = 1;
    int32 version = 2;
    string queue = 3;
    int32 ready_count = 4;
    int64 oldest_available_at = 5;
    // False = no worker polling this node serves this queue at this version, so these tokens sit
    // dispatchable and unclaimed.
    bool covered = 6;
}

message BacklogCoverage {
    repeated BacklogSlice slices = 1;
    int32 live_pollers = 2;
}

message StartInstanceRequest {
    string workflow = 1;
    google.protobuf.Value context = 2;
    optional int32 version = 3;
    optional string correlation_id = 4;
}

message StartInstanceResult {
    string instance_id = 1;
    string workflow = 2;
}

message InstanceView {
    string id = 1;
    string workflow = 2;
    int32 version = 3;
    string status = 4;
    optional string termination_reason = 5;
    optional string error = 6;
    google.protobuf.Value context = 7;
    int64 created_at = 8;
    int64 updated_at = 9;
}

message Token {
    string id = 1;
    string node_id = 2;
    string kind = 3;
    string status = 4;
    string activity = 5;
    int32 attempt = 6;
    int64 available_at = 7;
    optional string lease_owner = 8;
    optional string last_error = 9;
    // When the step ran on the reporting side (LOCAL_*); absent when not reported.
    optional int64 started_at = 10;
    optional int64 finished_at = 11;
    // What the step ran with and returned, where the server recorded it. A task's absent output left
    // the context unchanged; a predicate's output is its branch. Either may be a truncation marker:
    // {"$truncated": <length>, "head": "..."}.
    optional google.protobuf.Value input = 12;
    optional google.protobuf.Value output = 13;
    int64 created_at = 14;
}

message InstanceDetail {
    InstanceView instance = 1;
    repeated Token tokens = 2;
}

message ListInstancesRequest {
    optional string workflow = 1;
    optional string status = 2;
    int32 limit = 3;
    // When set, return only instances started with this correlation id (business key lookup).
    optional string correlation_id = 4;
}

message InstanceList {
    repeated InstanceView instances = 1;
}

message InstanceIdRequest {
    string instance_id = 1;
}

message CancelInstanceRequest {
    string instance_id = 1;
    string reason = 2;
}

message SignalRequest {
    string instance_id = 1;
    string signal = 2;
    google.protobuf.Value payload = 3;
}

message CreateScheduleRequest {
    string workflow = 1;
    oneof cadence {
        int64 every_millis = 2;   // fixed interval
        string cron = 3;          // five-field cron, evaluated in UTC
    }
    google.protobuf.Value context = 4;
}

message ScheduleView {
    string id = 1;
    string workflow = 2;
    int64 every_millis = 3;       // 0 when cron-based
    string cron = 4;              // empty when interval-based
    int64 next_fire_at = 5;
    int64 created_at = 6;
}

message ScheduleList {
    repeated ScheduleView schedules = 1;
}

message ScheduleIdRequest {
    string id = 1;
}

message CancelInstanceResult {
    string cancelled = 1;
}

message PollRequest {
    string worker_id = 1;
    repeated string queues = 2;
    int32 max = 3;
    int64 lease_millis = 4;
    int64 wait_millis = 5;
    // Empty = serve every version, which is the default and what an unversioned worker sends.
    // Non-empty = claim only these (workflow, version) pairs.
    repeated WorkflowVersion versions = 6;
}

message TaskActivation {
    string task_id = 1;
    string instance_id = 2;
    string workflow = 3;
    int32 version = 4;
    string node_id = 5;
    string step_name = 6;
    string activity = 7;
    string kind = 8;
    int32 attempt = 9;
    int64 lease_expires_at = 10;
    string lease_owner = 11;
    google.protobuf.Value context = 12;
    string execution_mode = 13;   // SERVER | LOCAL_SYNC | LOCAL_ASYNC (already resolved by the server)
    // Set only for a forEach item step: `context` is then the ITEM's current value (any JSON value,
    // scalars included), and base_context is the frozen pre-forEach context (read-only for items).
    google.protobuf.Value base_context = 14;
    int64 item_index = 15;        // the item's position in the input collection
    string item_map_key = 16;     // the item's source key, when the input collection was a map
    // Set only for the combine of a forEach or of created branches: where its results are staged. A
    // worker binds a created combine by it, since no graph it holds has the node.
    string collect_key = 17;
    // Set only for a fork's combine: the arms, in fork order, that it merges.
    repeated string arm_names = 18;
}

message TaskList {
    repeated TaskActivation tasks = 1;
    // Backpressure hint: when > 0 the server is shedding load (it is over its memory threshold), so
    // the worker should hold off this many millis before polling again instead of retrying
    // immediately. The value already includes per-response jitter.
    int64 retry_after_millis = 2;
}

// A domain event a handler emitted while running its step. The server appends it to the event
// log in the transaction that settles the token, so an attempt that threw leaves none behind and
// its retry emits fresh. instance, workflow, correlation, node and seq are filled in server-side
// from the token; a handler supplies only these two fields.
message EmittedEvent {
    string type = 1;                       // handler-chosen; "wf." is reserved for lifecycle events
    google.protobuf.Value payload = 2;     // a JSON object
}

// One locally-executed step reported back to the server (LOCAL_SYNC/LOCAL_ASYNC).
message StepResult {
    string node_id = 1;
    oneof outcome {
        google.protobuf.Value merge = 2;   // TASK: the complete next context
        bool predicate_value = 3;          // PREDICATE: branch selector
    }
    reserved 4;                            // was the error of a step OBSERVED execution reported
    reserved "error";
    // When the step ran, epoch millis; 0 = not reported. Kept on the token for duration stats.
    int64 started_at = 5;
    int64 finished_at = 6;
    repeated EmittedEvent events = 7;      // emitted while this step ran, in emission order
    repeated CreatedBranch branches = 8;   // created while this step ran (Step.create), in creation order
}

// A branch a step created at run time: its whole context, an optional key, and its chain of steps.
message CreatedBranch {
    google.protobuf.Value input = 1;
    string key = 2;                        // optional; all-or-none across one report
    repeated BranchStep steps = 3;         // at least one
}

message BranchStep {
    string name = 1;                       // the step name, signal name or sub-flow node name; blank for a sleep or fork
    string kind = 2;                       // TASK | PREDICATE | SLEEP | SIGNAL | SUB_WORKFLOW | FORK
    bool compensable = 3;
    string queue = 4;                      // blank = the creating step's queue
    google.protobuf.Value retry = 5;       // a retry policy as JSON; absent = the creating step's
    int64 sleep_millis = 6;
    string combine = 7;                    // a TASK: creates branches, collected by this combine; a FORK: merges its arms
    string workflow = 8;                   // SUB_WORKFLOW: the child workflow
    repeated BranchStep escalation = 9;    // SIGNAL: run when the deadline in sleep_millis passes
    repeated BranchArm arms = 10;          // FORK: each arm runs on its own copy of the context
}

message BranchArm {
    repeated BranchStep steps = 1;
}

// One instance's worth of a report: the ordered steps one worker ran from one leased token.
message ReportedRun {
    string task_id = 1;                    // the currently-leased token these steps start at
    string lease_owner = 2;
    repeated StepResult steps = 3;         // ordered, at least one; one step is the ordinary case
    // The worker will not take a continuation: it reached a boundary, filled its batch, or is
    // draining. A statement about this worker, not about the workflow -- a mode that never chains
    // hands back regardless.
    bool final = 4;
}

// One run, or several across different instances. Several are admitted only where batching is
// sound (LOCAL_ASYNC, one run per instance, no sub-workflow) and commit together; a run the batch
// will not take is refused on its own and may be reported again in a call of its own. A single
// run carries no batching restrictions -- there is nothing to batch it with.
message ReportStepsRequest {
    repeated ReportedRun runs = 1;         // at least one, each naming a different instance
}

message RunApplied {
    // Any InstanceStatus, not just the terminal four: a concurrent failure can leave the
    // instance COMPENSATING between a worker's local steps. Clients treat anything but
    // RUNNING as "stop here". See docs/state-machines.md.
    string instance_status = 1;            // RUNNING | COMPLETED | FAILED | CANCELLED
                                           // | COMPENSATING | COMPENSATED | COMPENSATION_FAILED
    int64 lease_expires_at = 2;            // renewed lease covering continued local execution
    string next_task_id = 3;              // token to reference for the next local step (blank if handed back)
}

// A run's fate. A refused run wrote nothing and may be reported again; error_status carries the
// status the call would have raised, so a client reporting a lone run can raise it as before.
message RunOutcome {
    string task_id = 1;
    RunApplied applied = 2;                // set when the run applied (error_status == 0)
    int32 error_status = 3;                // 0 ok; else the status this run would have thrown
    string error = 4;
}

message ReportStepsResult {
    repeated RunOutcome results = 1;       // one per submitted run, in submission order
}

message StepStatsRequest {
    string workflow = 1;
    int32 version = 2;                     // 0 = the latest registered version
    int64 since = 3;                       // epoch millis; 0 = no lower bound
    int32 sample = 4;                      // newest settled steps considered; 0 = a server default
}

message NodeStats {
    string node_id = 1;
    string name = 2;
    int64 count = 3;
    double mean_millis = 4;
    int64 p50_millis = 5;
    int64 p95_millis = 6;
    int64 max_millis = 7;
    // How long the step waited to be claimed by a worker (ready -> claimed).
    int64 wait_p50_millis = 8;
    int64 wait_p95_millis = 9;
}

message StepStats {
    string workflow = 1;
    int32 version = 2;
    repeated NodeStats nodes = 3;          // graph order is not implied; sort by p95 for a bottleneck view
}

message TaskFailureRequest {
    string task_id = 1;
    string lease_owner = 2;
    string message = 3;
    bool retryable = 4;
}

message HeartbeatRequest {
    string task_id = 1;
    string lease_owner = 2;
    int64 extend_millis = 3;
}

message HeartbeatResult {
    int64 lease_expires_at = 1;
}

message PollEventsRequest {
    string consumer = 1;          // named cursor; the first poll registers it
    int32 max = 2;
    int64 wait_millis = 3;        // long-poll, clamped like PollTasks
    // Start position when the first poll creates the cursor; ignored once it exists.
    // 0 = tail (only events appended from now on), -1 = earliest retained, else a seq.
    int64 start_from = 4;
}

// One entry of the event log: an instance lifecycle transition, written in the transaction
// that made it. type is wf.started | wf.completed | wf.failed | wf.cancelled | wf.compensating
// | wf.compensated | wf.compensation_failed; the wf. prefix is reserved for the engine.
message EventView {
    int64 seq = 1;                // strictly increasing within one shard's log; gaps are possible
    string instance_id = 2;
    string workflow = 3;
    int32 version = 4;
    string correlation_id = 5;
    string type = 6;
    int64 created_at = 7;
    google.protobuf.Value payload = 8;
    string node_id = 9;           // the step that emitted it; empty for a lifecycle entry
    int32 shard = 10;             // the shard whose log holds it; (shard, seq) identifies it
    string cursor = 11;           // opaque: the consumer's place just after this entry, for AckEvents
}

message EventList {
    repeated EventView events = 1;
    // Same backpressure hint as TaskList: when > 0, hold off this many millis before polling again.
    int64 retry_after_millis = 2;
}

message AckEventsRequest {
    string consumer = 1;
    // Cumulative: acknowledges every event with seq <= this. Only for a log on one shard; a sharded
    // log refuses it as INVALID_ARGUMENT.
    int64 acked_seq = 2;
    // Cumulative: the cursor of the last event handled, acknowledging it and everything before it.
    // Takes precedence over acked_seq when set.
    string acked_cursor = 3;
}

