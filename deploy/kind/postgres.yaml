# Shared Postgres: this is what lets the server pods form one cluster (membership,
# leader election and task hand-out all live in this database). Ephemeral storage --
# tearing the cluster down loses all workflow state, which is what you want for a demo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_DB, value: wiggle }
            - { name: POSTGRES_USER, value: wiggle }
            - { name: POSTGRES_PASSWORD, value: wiggle }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "wiggle"]
            initialDelaySeconds: 3
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
