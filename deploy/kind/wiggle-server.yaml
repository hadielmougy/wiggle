# The wiggle server nodes. Each replica is one cluster node: they all serve the gRPC
# control plane and pull work; exactly one is elected leader for housekeeping. Scale
# the replica count to change the number of nodes (scripts/kind-up.sh does this).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiggle-server
  labels:
    app: wiggle-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: wiggle-server
  template:
    metadata:
      labels:
        app: wiggle-server
    spec:
      containers:
        - name: wiggle
          image: wiggle-server:local
          imagePullPolicy: IfNotPresent   # use the image loaded into kind, never a registry
          ports:
            - containerPort: 8080
          env:
            # A distinct node name per pod, so cluster membership reads clearly.
            - name: WIGGLE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - { name: WIGGLE_PORT, value: "8080" }
            # Promote server-side timers (sleeps) quickly and in bulk. The defaults
            # (1000ms tick, batch 100) cap timer throughput at ~100/s and add up to a
            # second of latency to every sleep, which dominates throughput under load.
            - { name: WIGGLE_POLL_INTERVAL_MILLIS, value: "200" }
            - { name: WIGGLE_HOUSEKEEPING_BATCH, value: "500" }
            - { name: WIGGLE_JDBC_URL, value: "jdbc:postgresql://postgres:5432/wiggle" }
            - { name: WIGGLE_JDBC_USER, value: "wiggle" }
            - { name: WIGGLE_JDBC_PASSWORD, value: "wiggle" }
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: wiggle
spec:
  type: NodePort
  selector:
    app: wiggle-server
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
