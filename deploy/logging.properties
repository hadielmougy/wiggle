# Sample java.util.logging configuration for the Wiggle server.
#
# Wiggle logs through java.util.logging (via System.Logger), so this file gives you full
# control over file output without any dependency. Point the JVM at it:
#
#   WIGGLE_OPTS="-Djava.util.logging.config.file=/etc/wiggle/logging.properties" bin/wiggle
#
# For the simple case you don't need this file at all -- set WIGGLE_LOG_FILE (and optionally
# WIGGLE_LOG_LEVEL) and the server attaches a rotating file handler for you.

# Write to both a rotating file and the console.
handlers = java.util.logging.FileHandler, java.util.logging.ConsoleHandler
.level   = INFO

# Rotating file handler: 5 files of 10 MB each, appended across restarts.
java.util.logging.FileHandler.pattern   = /var/log/wiggle/wiggle-%g.log
java.util.logging.FileHandler.limit      = 10485760
java.util.logging.FileHandler.count      = 5
java.util.logging.FileHandler.append     = true
java.util.logging.FileHandler.formatter  = java.util.logging.SimpleFormatter
java.util.logging.FileHandler.level      = ALL

java.util.logging.ConsoleHandler.level   = INFO

# Wiggle's own packages. NOTE the level mapping from System.Logger to java.util.logging:
#   DEBUG -> FINE, TRACE -> FINER, INFO -> INFO, WARNING -> WARNING, ERROR -> SEVERE
# Set this to FINE to capture Wiggle's DEBUG lines (housekeeping, heartbeats, step failures).
com.wiggle.level = INFO

# Trim noisy third-party loggers if desired.
# io.grpc.level = WARNING
