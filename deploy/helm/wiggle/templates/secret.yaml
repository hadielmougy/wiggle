{{- /* Create a JDBC Secret only when a url is provided inline and no existing Secret is named. */ -}}
{{- if and .Values.storage.jdbc.url (not .Values.storage.jdbc.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-jdbc" (include "wiggle.fullname" .) }}
  labels:
    {{- include "wiggle.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ .Values.storage.jdbc.url | quote }}
  user: {{ .Values.storage.jdbc.user | quote }}
  password: {{ .Values.storage.jdbc.password | quote }}
{{- end }}
