apiVersion: v1
kind: Service
metadata:
  name: {{ include "wiggle.fullname" . }}
  labels:
    {{- include "wiggle.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "wiggle.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.apiPort }}
      targetPort: http
    - name: health
      port: {{ .Values.service.healthPort }}
      targetPort: health
    {{- if gt (int .Values.service.portalPort) 0 }}
    - name: portal
      port: {{ .Values.service.portalPort }}
      targetPort: portal
    {{- end }}
