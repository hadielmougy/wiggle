apiVersion: v1
kind: Service
metadata:
  name: {{ include "wiggle.fullname" . }}
  labels:
    {{- include "wiggle.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "wiggle.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: grpc
    - name: health
      port: {{ .Values.service.healthPort }}
      targetPort: health
