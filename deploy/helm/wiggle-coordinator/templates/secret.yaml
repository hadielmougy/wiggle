{{- if and (eq .Values.store.backend "jdbc") .Values.store.jdbc.url (not .Values.store.jdbc.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-jdbc" (include "wiggle-coordinator.fullname" .) }}
  labels:
    {{- include "wiggle-coordinator.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ .Values.store.jdbc.url | quote }}
  user: {{ .Values.store.jdbc.user | quote }}
  password: {{ .Values.store.jdbc.password | quote }}
{{- end }}
