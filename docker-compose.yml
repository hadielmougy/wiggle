# Postgres for multi-node clustering. The default in-memory store needs none of this.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wiggle
      POSTGRES_USER: wiggle
      POSTGRES_PASSWORD: wiggle
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiggle"]
      interval: 3s
      timeout: 3s
      retries: 10
